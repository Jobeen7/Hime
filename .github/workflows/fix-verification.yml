name: FixVerification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install native deps
        run: bash install-deps.sh

      - name: Generate verification metadata
        run: |
          set +e
          ./gradlew --write-verification-metadata connectedDebugAndroidTest || true
          echo "exit:$?"
          # 不依赖 connected 任务成功，只希望依赖解析写齐元数据；再次触发解析确认文件
          ./gradlew --write-verification-metadata dependencies --configuration :app:_internal-unified-test-platform-android-test-plugin-host-additional-test-output || true
          ls -lh gradle/verification-metadata.xml

      - name: Upload verification metadata
        uses: actions/upload-artifact@ea165891db0d67debdfb185e31808d1d0060a4a46 # v4
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
