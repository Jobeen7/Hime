# 快速 CI（第 0 批 / 施工方案 §二）：仅 dev/**、feat/** 分支。
# main 的完整验证仍走 ci.yml（含 lint、R8 Release、dex grep），本文件
# 只保证日常分支能快速闭环：单测 + Debug 包，跳过 clean 与 R8 Release。
# 注意：assembleDebug 含 externalNativeBuild（CMake 依赖 deps/librime），
# deps 目录是 gitignore 的，仓库里没有；没跑 install-deps.sh 时
# CMake 配置期就会失败，所以在 test 之后、assemble 之前补这一步。
name: CI Fast (dev)

on:
  push:
    branches:
      - "dev/**"
      - "feat/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/deps
          key: hime-native-deps-${{ runner.os }}-${{ hashFiles('install-deps.sh') }}
          restore-keys: |
            hime-native-deps-${{ runner.os }}-

      - name: Rebuild resource.zip
        run: bash tools/wanxiang-builtin/build-resource.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Install native deps
        run: bash install-deps.sh

      - name: Assemble Debug
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
