name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Rebuild resource.zip
        run: bash tools/wanxiang-builtin/build-resource.sh

      - name: Install native deps
        run: bash install-deps.sh

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > hime-release.jks
          ls -lh hime-release.jks

      - name: Build release APK
        run: |
          ./gradlew clean assembleRelease \
            -PHIME_STORE_FILE=$PWD/hime-release.jks \
            -PHIME_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PHIME_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PHIME_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}

      - name: Verify Rime.handleMessage survived R8 (dex grep)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK" && ls -lh "$APK"
          for DEX in $(unzip -l "$APK" | awk '/classes[0-9]*\.dex/ {print $4}'); do
            unzip -p "$APK" "$DEX" | strings | grep -q handleMessage && exit 0
          done
          echo "handleMessage not found in dex" >&2
          exit 1

      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165891db0d67debdfb185e31808d1d0060a4a46 # v4
        if: always()
        with:
          name: r8-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish Release (draft preview)
        # 与 HIME 一致：v* tag 自动建草稿（draft）+ 预览（prerelease），仅协作者可见，
        # 不设为 Latest；正式版再在网页点 Publish 切换为公开 Latest。
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf6318 # v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: true
          prerelease: true
          generate_release_notes: true
